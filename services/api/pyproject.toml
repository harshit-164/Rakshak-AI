[project]
name = "sif-review-api"
version = "0.1.0"
description = "FastAPI backend for the SIH26165 safety review prototype"
requires-python = ">=3.12,<3.15"
dependencies = [
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "google-genai==2.22.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pyjwt==2.13.0",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "httpx2==2.12.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.5",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
